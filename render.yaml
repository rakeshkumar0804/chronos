services:
  - type: web
    name: chronos-api
    env: node
    plan: free
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chronos-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
    healthCheckPath: /api/health

databases:
  - name: chronos-db
    plan: free
    databaseName: chronos
    user: postgres
