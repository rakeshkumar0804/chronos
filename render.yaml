services:
  - type: web
    name: chronos-api
    env: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string (neon.tech)
      - key: GEMINI_API_KEY
        sync: false # Set to your Google Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
    healthCheckPath: /api/health
